[program:genesis-radar-news]
command=python3 /opt/genesis-monitor/monitor/worker_radar_news.py
directory=/opt/genesis-monitor/monitor
autostart=true
autorestart=true
startsecs=10
startretries=5
user=root
redirect_stderr=true
stdout_logfile=/var/log/genesis-radar-news.out.log
stderr_logfile=/var/log/genesis-radar-news.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=PATH="/usr/local/bin:/usr/bin:/bin"
